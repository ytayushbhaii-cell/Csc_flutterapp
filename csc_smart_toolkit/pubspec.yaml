name: csc_smart_toolkit
description: CSC Smart Toolkit - Offline document processing and utility tools
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Navigation
  go_router: ^14.2.7

  # Storage
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4

  # Permissions
  permission_handler: ^11.3.1

  # Media
  image_picker: ^1.1.2
  file_picker: ^8.1.2

  # UI
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.2.1

  # Internationalization
  intl: ^0.19.0

  cupertino_icons: ^1.0.8
  image: '>=4.1.0 <4.6.0'
  share_plus: ^12.0.2

  # PDF generation & rendering
  pdf: ^3.11.0
  printing: ^5.13.2

  # Offline OCR
  google_mlkit_text_recognition: ^0.13.1

  # ── QR & Barcode ──────────────────────────────────────────────────────────
  # QR code generation
  qr_flutter: ^4.1.0
  # Camera-based QR & barcode scanning (offline, ML Kit bundled)
  mobile_scanner: ^6.0.0
  # 1-D barcode rendering widget
  barcode_widget: ^2.0.3

  # ── Signature drawing canvas ──────────────────────────────────────────────
  signature: ^5.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/app_icon.png
    - assets/splash_logo.png
